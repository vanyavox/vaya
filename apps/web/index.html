<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#6c5ce7" />
    <!-- iOS Home Screen PWA (required for Web Push on Safari iOS) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="V&Y" />
    <!-- iOS Home Screen icons: opaque PNG (Safari ignores alpha on touch icons) -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/apple-touch-icon-167.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon-152.png" />
    <title>Vaya — пространство для пары</title>
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <script>
      // Set theme before CSS loads to prevent flash
      (function () {
        var t = localStorage.getItem('vaya-theme');
        if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.classList.toggle('dark', t === 'dark');
      })();
    </script>
    <style>
      /* Critical theme variables — loaded before Tailwind CSS */
      :root {
        --t-bg: #f8f9fa;
        --t-surface: #ffffff;
        --t-border: #e5e7eb;
        --t-text: #1a1a2e;
        --t-muted: #6b7280;
        --t-hover: #f3f4f6;
        --t-input-bg: #ffffff;
      }
      html.dark {
        --t-bg: #0f172a;
        --t-surface: #1e293b;
        --t-border: #334155;
        --t-text: #f1f5f9;
        --t-muted: #94a3b8;
        --t-hover: #2d3b52;
        --t-input-bg: #1e293b;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
