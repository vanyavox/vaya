services:
  postgres:
    image: postgres:16-alpine
    container_name: vaya-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vaya
      POSTGRES_PASSWORD: vaya
      POSTGRES_DB: vaya
    ports:
      - "5432:5432"
    volumes:
      - vaya-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaya"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  vaya-pgdata:
