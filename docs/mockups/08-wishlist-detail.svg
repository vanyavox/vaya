  <text x="300" y="422" font-size="15" font-weight="600" fill="#1A1A2E">Книга «Атлант расправил</text>
  <text x="300" y="442" font-size="15" font-weight="600" fill="#1A1A2E">плечи»</text>
  <text x="300" y="472" font-size="16" font-weight="600" fill="#1A1A2E">1 200 ₽</text>
  <rect x="300" y="486" width="100" height="24" rx="12" fill="#FDECEA"/>
  <text x="350" y="502" font-size="11" font-weight="500" fill="#E17055" text-anchor="middle">Высокий</text>
  <rect x="412" y="486" width="100" height="24" rx="12" fill="#E8F8F5"/>
  <text x="462" y="502" font-size="11" font-weight="500" fill="#00B894" text-anchor="middle">Доступно</text>

  <!-- Wish card 2 -->
  <rect x="660" y="232" width="356" height="280" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="680" y="252" width="316" height="140" rx="8" fill="#E5E7EB"/>
  <text x="838" y="328" font-size="13" fill="#6B7280" text-anchor="middle">Фото товара</text>
  <text x="680" y="422" font-size="15" font-weight="600" fill="#1A1A2E">Наушники Sony</text>
  <text x="680" y="442" font-size="15" font-weight="600" fill="#1A1A2E">WH-1000XM5</text>
  <text x="680" y="472" font-size="16" font-weight="600" fill="#1A1A2E">25 000 ₽</text>
  <rect x="680" y="486" width="140" height="24" rx="12" fill="#FDF6E3"/>
  <text x="750" y="502" font-size="11" font-weight="500" fill="#B7791F" text-anchor="middle">Зарезервировано</text>
  <!-- reserved by partner -->
  <circle cx="856" cy="498" r="14" fill="#6C5CE7"/>
  <text x="856" y="503" font-size="10" font-weight="600" fill="#FFFFFF" text-anchor="middle">ИС</text>
  <text x="878" y="503" font-size="11" fill="#6B7280">Илья</text>

  <!-- Wish card 3 -->
  <rect x="1040" y="232" width="356" height="280" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="1060" y="252" width="316" height="140" rx="8" fill="#E5E7EB"/>
  <text x="1218" y="328" font-size="13" fill="#6B7280" text-anchor="middle">Фото товара</text>
  <text x="1060" y="422" font-size="15" font-weight="600" fill="#1A1A2E">Свеча Yankee</text>
  <text x="1060" y="472" font-size="16" font-weight="600" fill="#1A1A2E">2 500 ₽</text>
  <rect x="1060" y="486" width="100" height="24" rx="12" fill="#FDECEA"/>
  <text x="1110" y="502" font-size="11" font-weight="500" fill="#E17055" text-anchor="middle">Подарено</text>

  <!-- Wish card 4 -->
  <rect x="280" y="536" width="356" height="280" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="300" y="556" width="316" height="140" rx="8" fill="#E5E7EB"/>
  <text x="458" y="632" font-size="13" fill="#6B7280" text-anchor="middle">Фото товара</text>
  <text x="300" y="726" font-size="15" font-weight="600" fill="#1A1A2E">Абонемент в спа</text>
  <text x="300" y="776" font-size="16" font-weight="600" fill="#1A1A2E">8 000 ₽</text>
  <rect x="300" y="790" width="100" height="24" rx="12" fill="#F3F4F6"/>
  <text x="350" y="806" font-size="11" font-weight="500" fill="#6B7280" text-anchor="middle">Средний</text>
  <rect x="412" y="790" width="100" height="24" rx="12" fill="#E8F8F5"/>
  <text x="462" y="806" font-size="11" font-weight="500" fill="#00B894" text-anchor="middle">Доступно</text>

  <!-- Wish card 5 -->
  <rect x="660" y="536" width="356" height="280" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="680" y="556" width="316" height="140" rx="8" fill="#E5E7EB"/>
  <text x="838" y="632" font-size="13" fill="#6B7280" text-anchor="middle">Фото товара</text>
  <text x="680" y="726" font-size="15" font-weight="600" fill="#1A1A2E">Фотоальбом</text>
  <text x="680" y="776" font-size="16" font-weight="600" fill="#1A1A2E">1 500 ₽</text>
  <rect x="680" y="790" width="100" height="24" rx="12" fill="#F3F4F6"/>
  <text x="730" y="806" font-size="11" font-weight="500" fill="#6B7280" text-anchor="middle">Низкий</text>
  <rect x="792" y="790" width="100" height="24" rx="12" fill="#E8F8F5"/>
  <text x="842" y="806" font-size="11" font-weight="500" fill="#00B894" text-anchor="middle">Доступно</text>

  <!-- FAB -->
  <circle cx="1340" cy="820" r="32" fill="#6C5CE7"/>
  <text x="1340" y="830" font-size="28" fill="#FFFFFF" text-anchor="middle">+</text>
  <rect x="1170" y="806" width="150" height="28" rx="14" fill="#1A1A2E" opacity="0.85"/>
  <text x="1245" y="825" font-size="12" font-weight="500" fill="#FFFFFF" text-anchor="middle">Добавить желание</text>
</svg>
