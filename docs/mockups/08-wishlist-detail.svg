<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" font-family="Inter, Arial, sans-serif">
  <!-- Background -->
  <rect width="1440" height="900" fill="#F8F9FA"/>

  <!-- Sidebar -->
  <rect x="0" y="0" width="240" height="900" fill="#FFFFFF"/>
  <line x1="240" y1="0" x2="240" y2="900" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Logo -->
  <rect x="24" y="28" width="36" height="36" rx="10" fill="#6C5CE7"/>
  <circle cx="42" cy="46" r="8" fill="#FFFFFF" opacity="0.9"/>
  <text x="72" y="52" font-size="20" font-weight="600" fill="#1A1A2E">Vaya</text>

  <!-- Nav -->
  <circle cx="40" cy="122" r="8" fill="#6B7280"/>
  <text x="64" y="128" font-size="15" fill="#6B7280">Дашборд</text>

  <rect x="16" y="152" width="208" height="44" rx="8" fill="#6C5CE7"/>
  <circle cx="40" cy="174" r="8" fill="#FFFFFF"/>
  <text x="64" y="180" font-size="15" font-weight="500" fill="#FFFFFF">Желания</text>

  <circle cx="40" cy="226" r="8" fill="#6B7280"/>
  <text x="64" y="232" font-size="15" fill="#6B7280">Календарь</text>

  <circle cx="40" cy="278" r="8" fill="#6B7280"/>
  <text x="64" y="284" font-size="15" fill="#6B7280">Дела</text>

  <circle cx="40" cy="330" r="8" fill="#6B7280"/>
  <text x="64" y="336" font-size="15" fill="#6B7280">Настройки</text>

  <!-- User -->
  <line x1="16" y1="820" x2="224" y2="820" stroke="#E5E7EB" stroke-width="1"/>
  <circle cx="48" cy="860" r="20" fill="#A29BFE"/>
  <text x="48" y="865" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">АК</text>
  <text x="80" y="856" font-size="14" font-weight="500" fill="#1A1A2E">Анна К.</text>
  <text x="80" y="874" font-size="12" fill="#6B7280">В паре с Ильей</text>

  <!-- Breadcrumb -->
  <text x="280" y="52" font-size="14" fill="#6B7280">Мои желания</text>
  <text x="388" y="52" font-size="14" fill="#6B7280">/</text>
  <text x="404" y="52" font-size="14" font-weight="500" fill="#1A1A2E">День рождения</text>

  <!-- Header row -->
  <text x="280" y="100" font-size="28" font-weight="600" fill="#1A1A2E">День рождения</text>
  <rect x="510" y="78" width="86" height="30" rx="15" fill="#EDEBFF"/>
  <text x="553" y="97" font-size="13" font-weight="500" fill="#6C5CE7" text-anchor="middle">Общий</text>
  <text x="280" y="128" font-size="14" fill="#6B7280">Подарки на день рождения для друг друга и друзей</text>

  <!-- Actions -->
  <rect x="1120" y="84" width="150" height="40" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="1195" y="109" font-size="14" font-weight="500" fill="#1A1A2E" text-anchor="middle">Редактировать</text>
  <text x="1370" y="109" font-size="14" font-weight="500" fill="#E17055" text-anchor="middle">Удалить</text>

  <!-- Filter chips -->
  <rect x="280" y="168" width="110" height="36" rx="18" fill="#6C5CE7"/>
  <text x="335" y="191" font-size="13" font-weight="500" fill="#FFFFFF" text-anchor="middle">Все (5)</text>

  <rect x="402" y="168" width="150" height="36" rx="18" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="477" y="191" font-size="13" fill="#6B7280" text-anchor="middle">Доступные (3)</text>

  <rect x="564" y="168" width="180" height="36" rx="18" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="654" y="191" font-size="13" fill="#6B7280" text-anchor="middle">Зарезервировано (1)</text>

  <rect x="756" y="168" width="130" height="36" rx="18" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="821" y="191" font-size="13" fill="#6B7280" text-anchor="middle">Подарено (1)</text>

  <!-- Wish card 1 -->
  <rect x="280" y="232" width="356" height="280" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="300" y="252" width="316" height="140" rx="8" fill="#E5E7EB"/>
