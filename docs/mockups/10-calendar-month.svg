  <circle cx="782" cy="500" r="16" fill="#6C5CE7"/>
  <text x="782" y="505" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">16</text>
  <text x="768" y="530" font-size="10" font-weight="500" fill="#6C5CE7">Сегодня</text>
  <text x="928" y="505" font-size="13" fill="#1A1A2E">17</text>
