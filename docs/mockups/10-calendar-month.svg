  <text x="1088" y="623" font-size="13" fill="#1A1A2E">25</text>
  <rect x="1088" y="634" width="140" height="24" rx="6" fill="#FDF6E3"/>
  <circle cx="1100" cy="646" r="4" fill="#FDCB6E"/>
  <text x="1110" y="650" font-size="11" fill="#1A1A2E">День рождения Ани</text>
  <text x="1248" y="623" font-size="13" fill="#1A1A2E">26</text>

  <!-- Row 5 days: 27-31 -->
  <text x="288" y="741" font-size="13" fill="#1A1A2E">27</text>
  <text x="448" y="741" font-size="13" fill="#1A1A2E">28</text>
  <text x="608" y="741" font-size="13" fill="#1A1A2E">29</text>
  <text x="768" y="741" font-size="13" fill="#1A1A2E">30</text>
  <text x="928" y="741" font-size="13" fill="#1A1A2E">31</text>

  <!-- Task dots under dates with due dates -->
  <circle cx="296" cy="760" r="3" fill="#6B7280"/>
  <circle cx="308" cy="760" r="3" fill="#6B7280"/>
  <circle cx="456" cy="760" r="3" fill="#6B7280"/>
  <circle cx="616" cy="760" r="3" fill="#6B7280"/>
  <circle cx="776" cy="760" r="3" fill="#6B7280"/>
  <circle cx="936" cy="760" r="3" fill="#6B7280"/>
  <circle cx="1096" cy="760" r="3" fill="#6B7280"/>
  <circle cx="1256" cy="760" r="3" fill="#6B7280"/>
