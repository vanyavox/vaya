  <rect x="608" y="634" width="140" height="24" rx="6" fill="#F3F4F6"/>
  <circle cx="620" cy="646" r="4" fill="#6B7280"/>
  <text x="630" y="650" font-size="11" fill="#1A1A2E">Покупки</text>
  <text x="768" y="623" font-size="13" fill="#1A1A2E">23</text>
  <text x="928" y="623" font-size="13" fill="#1A1A2E">24</text>
