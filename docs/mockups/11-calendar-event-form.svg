<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" font-family="Inter, Arial, sans-serif">
  <!-- Background -->
  <rect width="1440" height="900" fill="#F8F9FA"/>

  <!-- Sidebar (under dim) -->
  <rect x="0" y="0" width="240" height="900" fill="#FFFFFF"/>
  <line x1="240" y1="0" x2="240" y2="900" stroke="#E5E7EB" stroke-width="1"/>
  <rect x="24" y="28" width="36" height="36" rx="10" fill="#6C5CE7"/>
  <text x="72" y="52" font-size="20" font-weight="600" fill="#1A1A2E">Vaya</text>
  <text x="64" y="128" font-size="15" fill="#6B7280">Дашборд</text>
  <text x="64" y="180" font-size="15" fill="#6B7280">Желания</text>
  <rect x="16" y="204" width="208" height="44" rx="8" fill="#6C5CE7"/>
  <text x="64" y="232" font-size="15" font-weight="500" fill="#FFFFFF">Календарь</text>
  <text x="64" y="284" font-size="15" fill="#6B7280">Дела</text>
  <text x="64" y="336" font-size="15" fill="#6B7280">Настройки</text>

  <!-- Calendar shapes underneath -->
  <rect x="280" y="48" width="180" height="28" rx="6" fill="#D1D5DB"/>
  <rect x="280" y="96" width="280" height="36" rx="8" fill="#E5E7EB"/>
  <rect x="1196" y="96" width="200" height="36" rx="8" fill="#C4B5FD"/>
  <rect x="280" y="160" width="80" height="28" rx="14" fill="#C4B5FD"/>
  <rect x="372" y="160" width="100" height="28" rx="14" fill="#E5E7EB"/>
  <rect x="484" y="160" width="100" height="28" rx="14" fill="#E5E7EB"/>
  <rect x="280" y="210" width="1120" height="32" rx="8" fill="#E5E7EB"/>
  <rect x="280" y="250" width="1120" height="612" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
  <line x1="440" y1="250" x2="440" y2="862" stroke="#E5E7EB"/>
  <line x1="600" y1="250" x2="600" y2="862" stroke="#E5E7EB"/>
  <line x1="760" y1="250" x2="760" y2="862" stroke="#E5E7EB"/>
  <line x1="920" y1="250" x2="920" y2="862" stroke="#E5E7EB"/>
  <line x1="1080" y1="250" x2="1080" y2="862" stroke="#E5E7EB"/>
  <line x1="1240" y1="250" x2="1240" y2="862" stroke="#E5E7EB"/>
  <line x1="280" y1="372" x2="1400" y2="372" stroke="#E5E7EB"/>
  <line x1="280" y1="494" x2="1400" y2="494" stroke="#E5E7EB"/>
  <line x1="280" y1="616" x2="1400" y2="616" stroke="#E5E7EB"/>
  <line x1="280" y1="738" x2="1400" y2="738" stroke="#E5E7EB"/>
  <rect x="1088" y="520" width="140" height="22" rx="6" fill="#E9D5FF"/>

  <!-- Dim overlay -->
  <rect x="0" y="0" width="1440" height="900" fill="#1A1A2E" opacity="0.45"/>

  <!-- Modal card -->
  <rect x="460" y="30" width="520" height="840" rx="16" fill="#FFFFFF"/>

  <!-- Modal header -->
  <text x="490" y="76" font-size="20" font-weight="600" fill="#1A1A2E">Новое событие</text>
  <line x1="460" y1="98" x2="980" y2="98" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Название -->
  <text x="490" y="130" font-size="13" font-weight="500" fill="#1A1A2E">Название</text>
  <rect x="490" y="142" width="460" height="42" rx="8" fill="#FFFFFF" stroke="#6C5CE7" stroke-width="1.5"/>
  <text x="506" y="169" font-size="14" fill="#1A1A2E">Свидание</text>

  <!-- Описание -->
  <text x="490" y="216" font-size="13" font-weight="500" fill="#1A1A2E">Описание</text>
  <rect x="490" y="228" width="460" height="72" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="506" y="254" font-size="14" fill="#6B7280">Вечер вдвоём, бронь на 19:00</text>

  <!-- Место -->
  <text x="490" y="332" font-size="13" font-weight="500" fill="#1A1A2E">Место</text>
  <rect x="490" y="344" width="460" height="42" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="506" y="371" font-size="14" fill="#1A1A2E">Кафе на Тверской</text>

  <!-- Дата начала -->
  <text x="490" y="418" font-size="13" font-weight="500" fill="#1A1A2E">Дата начала</text>
  <rect x="490" y="430" width="280" height="42" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="506" y="457" font-size="14" fill="#1A1A2E">18.07.2026</text>
  <text x="790" y="418" font-size="13" font-weight="500" fill="#1A1A2E">Время</text>
  <rect x="790" y="430" width="160" height="42" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="806" y="457" font-size="14" fill="#1A1A2E">19:00</text>

  <!-- Дата окончания -->
  <text x="490" y="504" font-size="13" font-weight="500" fill="#1A1A2E">Дата окончания</text>
  <rect x="490" y="516" width="280" height="42" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="506" y="543" font-size="14" fill="#1A1A2E">18.07.2026</text>
  <text x="790" y="504" font-size="13" font-weight="500" fill="#1A1A2E">Время</text>
  <rect x="790" y="516" width="160" height="42" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="806" y="543" font-size="14" fill="#1A1A2E">21:00</text>

  <!-- Чекбокс Весь день -->
  <rect x="490" y="574" width="18" height="18" rx="4" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="518" y="588" font-size="14" fill="#1A1A2E">Весь день</text>

  <!-- Тип -->
  <text x="490" y="628" font-size="13" font-weight="500" fill="#1A1A2E">Тип</text>
  <rect x="490" y="640" width="460" height="42" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="506" y="667" font-size="14" fill="#1A1A2E">Свидание</text>
  <path d="M922 655 L928 663 L934 655" fill="none" stroke="#6B7280" stroke-width="1.5"/>

  <!-- Цвет -->
  <text x="490" y="714" font-size="13" font-weight="500" fill="#1A1A2E">Цвет</text>
  <circle cx="506" cy="746" r="14" fill="#6C5CE7"/>
  <circle cx="548" cy="746" r="14" fill="#FD79A8"/>
  <circle cx="548" cy="746" r="18" fill="none" stroke="#FD79A8" stroke-width="2"/>
  <circle cx="590" cy="746" r="14" fill="#FDCB6E"/>
  <circle cx="632" cy="746" r="14" fill="#00B894"/>
  <circle cx="674" cy="746" r="14" fill="#74B9FF"/>
  <circle cx="716" cy="746" r="14" fill="#6B7280"/>

  <!-- Переключатель Общее событие -->
  <text x="490" y="800" font-size="13" font-weight="500" fill="#1A1A2E">Общее событие</text>
  <rect x="800" y="782" width="48" height="28" rx="14" fill="#6C5CE7"/>
  <circle cx="834" cy="796" r="11" fill="#FFFFFF"/>

  <!-- Напоминание -->
  <text x="490" y="836" font-size="13" font-weight="500" fill="#1A1A2E">Напоминание</text>
  <rect x="490" y="848" width="220" height="36" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="506" y="871" font-size="13" fill="#1A1A2E">За 30 минут</text>
  <path d="M682 860 L688 868 L694 860" fill="none" stroke="#6B7280" stroke-width="1.5"/>

  <!-- Footer buttons -->
  <rect x="730" y="848" width="100" height="36" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="780" y="871" font-size="13" font-weight="500" fill="#1A1A2E" text-anchor="middle">Отмена</text>
  <rect x="846" y="848" width="134" height="36" rx="8" fill="#6C5CE7"/>
  <text x="913" y="871" font-size="13" font-weight="500" fill="#FFFFFF" text-anchor="middle">Сохранить</text>
</svg>
