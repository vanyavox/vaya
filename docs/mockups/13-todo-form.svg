<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <style>
      text { font-family: Inter, Arial, sans-serif; fill: #1A1A2E; }
      .muted { fill: #6B7280; }
      .white { fill: #FFFFFF; }
      .primary { fill: #6C5CE7; }
    </style>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1440" height="900" fill="#F8F9FA"/>

  <!-- ============ DIMMED BACKGROUND: todos page as gray shapes ============ -->
  <!-- Sidebar shape -->
  <rect x="0" y="0" width="240" height="900" fill="#FFFFFF"/>
  <line x1="240" y1="0" x2="240" y2="900" stroke="#E5E7EB" stroke-width="1"/>
  <rect x="24" y="28" width="32" height="32" rx="8" fill="#A29BFE" opacity="0.5"/>
  <rect x="68" y="38" width="70" height="14" rx="4" fill="#D1D5DB"/>
  <rect x="16" y="100" width="208" height="44" rx="8" fill="#E5E7EB"/>
  <rect x="16" y="152" width="208" height="44" rx="8" fill="#F3F4F6"/>
  <rect x="16" y="204" width="208" height="44" rx="8" fill="#F3F4F6"/>
  <rect x="16" y="256" width="208" height="44" rx="8" fill="#A29BFE" opacity="0.45"/>
  <rect x="16" y="308" width="208" height="44" rx="8" fill="#F3F4F6"/>
  <circle cx="48" cy="858" r="18" fill="#D1D5DB"/>

  <!-- Header shapes -->
  <rect x="272" y="42" width="120" height="28" rx="6" fill="#D1D5DB"/>
  <rect x="1220" y="32" width="188" height="44" rx="8" fill="#A29BFE" opacity="0.55"/>

  <!-- Filter bar shapes -->
  <rect x="272" y="100" width="112" height="36" rx="18" fill="#A29BFE" opacity="0.4"/>
  <rect x="396" y="100" width="112" height="36" rx="18" fill="#E5E7EB"/>
  <rect x="520" y="100" width="136" height="36" rx="18" fill="#E5E7EB"/>
  <rect x="668" y="100" width="180" height="36" rx="18" fill="#E5E7EB"/>
  <rect x="272" y="156" width="200" height="40" rx="8" fill="#E5E7EB"/>
  <rect x="496" y="156" width="110" height="40" rx="8" fill="#A29BFE" opacity="0.4"/>
  <rect x="614" y="156" width="130" height="40" rx="8" fill="#E5E7EB"/>
  <rect x="752" y="156" width="140" height="40" rx="8" fill="#E5E7EB"/>
  <rect x="900" y="156" width="130" height="40" rx="8" fill="#E5E7EB"/>
  <rect x="1080" y="156" width="328" height="40" rx="8" fill="#E5E7EB"/>

  <!-- Task row shapes -->
  <rect x="272" y="240" width="1136" height="64" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="272" y="316" width="1136" height="64" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="272" y="392" width="1136" height="64" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="272" y="468" width="1136" height="64" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="272" y="544" width="1136" height="64" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="272" y="620" width="1136" height="64" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="272" y="696" width="1136" height="64" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="272" y="772" width="1136" height="64" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>

  <!-- Dim overlay -->
  <rect x="0" y="0" width="1440" height="900" fill="#1A1A2E" opacity="0.55"/>

  <!-- ============ MODAL ============ -->
  <!-- Modal: 500px wide, centered: x = (1440-500)/2 = 470 -->
  <rect x="470" y="70" width="500" height="760" rx="12" fill="#FFFFFF"/>

  <!-- Modal title -->
  <text x="500" y="112" font-size="20" font-weight="700">Новая задача</text>
  <!-- Close X -->
  <text x="938" y="112" font-size="18" class="muted">✕</text>
  <line x1="470" y1="132" x2="970" y2="132" stroke="#E5E7EB"/>

  <!-- Field: Название -->
  <text x="500" y="166" font-size="13" class="muted">Название</text>
  <rect x="500" y="178" width="440" height="40" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="514" y="203" font-size="14">Купить продукты на неделю</text>

  <!-- Field: Описание -->
  <text x="500" y="250" font-size="13" class="muted">Описание</text>
  <rect x="500" y="262" width="440" height="88" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="514" y="286" font-size="14" class="muted">Молоко, хлеб, овощи, корм коту...</text>

  <!-- Field: Исполнитель -->
  <text x="500" y="382" font-size="13" class="muted">Исполнитель</text>
  <!-- Option: Аня (selected) -->
  <rect x="500" y="394" width="140" height="52" rx="8" fill="#EEF0FF" stroke="#6C5CE7" stroke-width="1.5"/>
  <circle cx="528" cy="420" r="14" fill="#A29BFE"/>
  <text x="528" y="425" font-size="11" text-anchor="middle" class="white">А</text>
  <text x="550" y="425" font-size="13" font-weight="600">Аня</text>
  <circle cx="620" cy="420" r="8" fill="#6C5CE7"/>
  <circle cx="620" cy="420" r="3" fill="#FFFFFF"/>

  <!-- Option: Макс -->
  <rect x="650" y="394" width="140" height="52" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
  <circle cx="678" cy="420" r="14" fill="#00B894"/>
  <text x="678" y="425" font-size="11" text-anchor="middle" class="white">М</text>
  <text x="700" y="425" font-size="13">Макс</text>
  <circle cx="770" cy="420" r="8" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5"/>

  <!-- Option: Не назначено -->
  <rect x="800" y="394" width="140" height="52" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
  <circle cx="828" cy="420" r="14" fill="#E5E7EB"/>
  <text x="828" y="425" font-size="11" text-anchor="middle" class="muted">?</text>
  <text x="848" y="425" font-size="13">Не назначено</text>
  <circle cx="920" cy="420" r="8" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5"/>

  <!-- Field: Категория -->
  <text x="500" y="478" font-size="13" class="muted">Категория</text>
  <rect x="500" y="490" width="440" height="40" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="510" y="500" width="80" height="20" rx="10" fill="#EEF0FF"/>
  <text x="550" y="515" font-size="12" text-anchor="middle" class="primary">Покупки</text>
  <text x="600" y="515" font-size="12" class="muted">Уборка · Готовка · Ремонт · Документы · Питомцы · Финансы · Другое</text>
  <text x="920" y="515" font-size="12" class="muted">⌄</text>

  <!-- Field: Приоритет -->
  <text x="500" y="562" font-size="13" class="muted">Приоритет</text>
  <!-- Низкий -->
  <rect x="500" y="574" width="140" height="40" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
  <circle cx="524" cy="594" r="8" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5"/>
  <circle cx="542" cy="594" r="5" fill="#00B894"/>
  <text x="556" y="599" font-size="13">Низкий</text>

  <!-- Средний -->
  <rect x="650" y="574" width="140" height="40" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
  <circle cx="674" cy="594" r="8" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5"/>
  <circle cx="692" cy="594" r="5" fill="#FDCB6E"/>
  <text x="706" y="599" font-size="13">Средний</text>

  <!-- Высокий (selected) -->
  <rect x="800" y="574" width="140" height="40" rx="8" fill="#EEF0FF" stroke="#6C5CE7" stroke-width="1.5"/>
  <circle cx="824" cy="594" r="8" fill="#6C5CE7"/>
  <circle cx="824" cy="594" r="3" fill="#FFFFFF"/>
  <circle cx="842" cy="594" r="5" fill="#E17055"/>
  <text x="856" y="599" font-size="13" font-weight="600">Высокий</text>

  <!-- Field: Срок -->
  <text x="500" y="646" font-size="13" class="muted">Срок</text>
  <!-- Date input -->
  <rect x="500" y="658" width="160" height="40" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="514" y="683" font-size="14">18.07.2026</text>
  <!-- Time input -->
  <rect x="672" y="658" width="100" height="40" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="686" y="683" font-size="14">18:00</text>
  <!-- Без срока checkbox -->
  <rect x="792" y="670" width="18" height="18" rx="4" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5"/>
  <text x="818" y="683" font-size="14">Без срока</text>

  <!-- Footer -->
  <line x1="470" y1="740" x2="970" y2="740" stroke="#E5E7EB"/>
  <!-- Отмена -->
  <rect x="680" y="762" width="120" height="44" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="740" y="790" font-size="14" text-anchor="middle">Отмена</text>
  <!-- Создать задачу -->
  <rect x="812" y="762" width="128" height="44" rx="8" fill="#6C5CE7"/>
  <text x="876" y="790" font-size="14" text-anchor="middle" class="white" font-weight="600">Создать задачу</text>
</svg>
