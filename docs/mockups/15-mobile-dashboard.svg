<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <defs>
    <style>
      text { font-family: Inter, Arial, sans-serif; fill: #1A1A2E; }
      .muted { fill: #6B7280; }
      .white { fill: #FFFFFF; }
      .primary { fill: #6C5CE7; }
    </style>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="390" height="844" fill="#F8F9FA"/>

  <!-- ============ TOP BAR ============ -->
  <rect x="0" y="0" width="390" height="64" fill="#FFFFFF"/>
  <line x1="0" y1="64" x2="390" y2="64" stroke="#E5E7EB"/>
  <!-- Logo -->
  <rect x="16" y="18" width="28" height="28" rx="8" fill="#6C5CE7"/>
  <text x="52" y="39" font-size="18" font-weight="700" class="primary">Vaya</text>
  <!-- Avatar right -->
  <circle cx="358" cy="32" r="18" fill="#A29BFE"/>
  <text x="358" y="37" font-size="13" text-anchor="middle" class="white" font-weight="600">А</text>

  <!-- ============ GREETING ============ -->
  <text x="16" y="110" font-size="22" font-weight="700">Привет, Аня!</text>
  <text x="16" y="134" font-size="14" class="muted">Пятница, 17 июля 2026</text>

  <!-- ============ 2x2 STAT GRID ============ -->
  <!-- Card 1: События -->
  <rect x="16" y="156" width="171" height="96" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
  <circle cx="40" cy="184" r="12" fill="#EEF0FF"/>
  <text x="36" y="222" font-size="13" class="muted">События</text>
  <text x="159" y="222" font-size="24" text-anchor="end" font-weight="700" class="primary">2</text>

  <!-- Card 2: Задачи -->
  <rect x="203" y="156" width="171" height="96" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
  <circle cx="227" cy="184" r="12" fill="#E8F8F3"/>
  <text x="223" y="222" font-size="13" class="muted">Задачи</text>
  <text x="346" y="222" font-size="24" text-anchor="end" font-weight="700" fill="#00B894">5</text>

  <!-- Card 3: Желания -->
  <rect x="16" y="268" width="171" height="96" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
  <circle cx="40" cy="296" r="12" fill="#FFF4E6"/>
  <text x="36" y="334" font-size="13" class="muted">Желания</text>
  <text x="159" y="334" font-size="24" text-anchor="end" font-weight="700" fill="#FDCB6E">3</text>

  <!-- Card 4: Дела -->
  <rect x="203" y="268" width="171" height="96" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
  <circle cx="227" cy="296" r="12" fill="#FDEDE8"/>
  <text x="223" y="334" font-size="13" class="muted">Дела</text>
  <text x="346" y="334" font-size="24" text-anchor="end" font-weight="700" fill="#E17055">8</text>

  <!-- ============ СЕГОДНЯ SECTION ============ -->
  <text x="16" y="402" font-size="17" font-weight="600">Сегодня</text>

  <!-- Event row 1 -->
  <rect x="16" y="418" width="358" height="64" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
  <circle cx="36" cy="450" r="5" fill="#6C5CE7"/>
  <text x="52" y="455" font-size="13" class="muted">10:00</text>
  <text x="110" y="455" font-size="14">Совещание с командой</text>

  <!-- Event row 2 -->
  <rect x="16" y="492" width="358" height="64" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
  <circle cx="36" cy="524" r="5" fill="#00B894"/>
  <text x="52" y="529" font-size="13" class="muted">18:30</text>
  <text x="110" y="529" font-size="14">Ужин с Максом</text>

  <!-- ============ ЗАДАЧИ SECTION ============ -->
  <text x="16" y="592" font-size="17" font-weight="600">Задачи</text>

  <!-- Task row 1 -->
  <rect x="16" y="608" width="358" height="52" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="32" y="624" width="20" height="20" rx="4" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5"/>
  <text x="64" y="639" font-size="14">Купить продукты на неделю</text>

  <!-- Task row 2 -->
  <rect x="16" y="670" width="358" height="52" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="32" y="686" width="20" height="20" rx="4" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5"/>
  <text x="64" y="701" font-size="14">Оплатить интернет</text>

  <!-- Task row 3 -->
  <rect x="16" y="732" width="358" height="52" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="32" y="748" width="20" height="20" rx="4" fill="#00B894" stroke="#00B894" stroke-width="1.5"/>
  <path d="M37 758 L41 762 L48 753" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="64" y="763" font-size="14" class="muted" text-decoration="line-through">Убрать квартиру</text>

  <!-- ============ BOTTOM TAB BAR ============ -->
  <rect x="0" y="788" width="390" height="56" fill="#FFFFFF"/>
  <line x1="0" y1="788" x2="390" y2="788" stroke="#E5E7EB"/>

  <!-- Tab 1: Дашборд (active) -->
  <rect x="27" y="800" width="22" height="22" rx="6" fill="#6C5CE7"/>
  <text x="38" y="836" font-size="10" text-anchor="middle" class="primary" font-weight="600">Дашборд</text>

  <!-- Tab 2: Желания -->
  <rect x="103" y="800" width="22" height="22" rx="6" fill="#E5E7EB"/>
  <text x="114" y="836" font-size="10" text-anchor="middle" class="muted">Желания</text>

  <!-- Tab 3: Календарь -->
  <rect x="184" y="800" width="22" height="22" rx="6" fill="#E5E7EB"/>
  <text x="195" y="836" font-size="10" text-anchor="middle" class="muted">Календарь</text>

  <!-- Tab 4: Дела -->
  <rect x="265" y="800" width="22" height="22" rx="6" fill="#E5E7EB"/>
  <text x="276" y="836" font-size="10" text-anchor="middle" class="muted">Дела</text>

  <!-- Tab 5: Профиль -->
  <rect x="341" y="800" width="22" height="22" rx="6" fill="#E5E7EB"/>
  <text x="352" y="836" font-size="10" text-anchor="middle" class="muted">Профиль</text>
</svg>
