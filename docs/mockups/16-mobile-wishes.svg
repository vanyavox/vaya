<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <defs>
    <style>
      text { font-family: Inter, Arial, sans-serif; fill: #1A1A2E; }
      .muted { fill: #6B7280; }
      .white { fill: #FFFFFF; }
      .primary { fill: #6C5CE7; }
    </style>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="390" height="844" fill="#F8F9FA"/>

  <!-- ============ TOP BAR ============ -->
  <rect x="0" y="0" width="390" height="64" fill="#FFFFFF"/>
  <line x1="0" y1="64" x2="390" y2="64" stroke="#E5E7EB"/>
  <!-- Back arrow -->
  <path d="M30 32 L20 32 M26 26 L20 32 L26 38" fill="none" stroke="#1A1A2E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Title -->
  <text x="48" y="39" font-size="18" font-weight="700">Желания</text>
  <!-- + button -->
  <rect x="338" y="18" width="36" height="36" rx="8" fill="#6C5CE7"/>
  <text x="356" y="42" font-size="20" text-anchor="middle" class="white">+</text>

  <!-- ============ TABS ============ -->
  <!-- Личные (active) -->
  <rect x="16" y="84" width="171" height="40" rx="8" fill="#6C5CE7"/>
  <text x="101" y="109" font-size="14" text-anchor="middle" class="white" font-weight="600">Личные</text>
  <!-- Общие -->
  <rect x="203" y="84" width="171" height="40" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="288" y="109" font-size="14" text-anchor="middle" class="muted">Общие</text>

  <!-- ============ WISH LIST CARDS ============ -->

  <!-- Card 1: День рождения -->
  <rect x="16" y="148" width="358" height="120" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="36" y="184" font-size="17" font-weight="600">День рождения</text>
  <!-- Badge: Общий -->
  <rect x="36" y="200" width="80" height="24" rx="12" fill="#EEF0FF"/>
  <text x="76" y="216" font-size="11" text-anchor="middle" class="primary">Общий</text>
  <!-- Count -->
  <text x="132" y="217" font-size="13" class="muted">5 желаний</text>
  <!-- Avatars -->
  <circle cx="320" cy="210" r="14" fill="#A29BFE" stroke="#FFFFFF" stroke-width="2"/>
  <text x="320" y="215" font-size="10" text-anchor="middle" class="white">А</text>
  <circle cx="344" cy="210" r="14" fill="#00B894" stroke="#FFFFFF" stroke-width="2"/>
  <text x="344" y="215" font-size="10" text-anchor="middle" class="white">М</text>
  <!-- Chevron -->
  <text x="352" y="172" font-size="12" class="muted">›</text>

  <!-- Card 2: На Новый год -->
  <rect x="16" y="284" width="358" height="120" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="36" y="320" font-size="17" font-weight="600">На Новый год</text>
  <!-- Badge: Личный -->
  <rect x="36" y="336" width="80" height="24" rx="12" fill="#F3F4F6"/>
  <text x="76" y="352" font-size="11" text-anchor="middle" class="muted">Личный</text>
  <!-- Count -->
  <text x="132" y="353" font-size="13" class="muted">8 желаний</text>
  <!-- Chevron -->
  <text x="352" y="308" font-size="12" class="muted">›</text>

  <!-- Card 3: Мечты -->
  <rect x="16" y="420" width="358" height="120" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="36" y="456" font-size="17" font-weight="600">Мечты</text>
  <!-- Badge: Общий -->
  <rect x="36" y="472" width="80" height="24" rx="12" fill="#EEF0FF"/>
  <text x="76" y="488" font-size="11" text-anchor="middle" class="primary">Общий</text>
  <!-- Count -->
  <text x="132" y="489" font-size="13" class="muted">3 желания</text>
  <!-- Avatars -->
  <circle cx="320" cy="482" r="14" fill="#A29BFE" stroke="#FFFFFF" stroke-width="2"/>
  <text x="320" y="487" font-size="10" text-anchor="middle" class="white">А</text>
  <circle cx="344" cy="482" r="14" fill="#00B894" stroke="#FFFFFF" stroke-width="2"/>
  <text x="344" y="487" font-size="10" text-anchor="middle" class="white">М</text>
  <!-- Chevron -->
  <text x="352" y="444" font-size="12" class="muted">›</text>

  <!-- ============ FAB ============ -->
  <!-- FAB bottom-right above tab bar -->
  <circle cx="332" cy="742" r="28" fill="#6C5CE7"/>
  <text x="332" y="752" font-size="28" text-anchor="middle" class="white">+</text>

  <!-- ============ BOTTOM TAB BAR ============ -->
  <rect x="0" y="788" width="390" height="56" fill="#FFFFFF"/>
  <line x1="0" y1="788" x2="390" y2="788" stroke="#E5E7EB"/>

  <!-- Tab 1: Дашборд -->
  <rect x="27" y="800" width="22" height="22" rx="6" fill="#E5E7EB"/>
  <text x="38" y="836" font-size="10" text-anchor="middle" class="muted">Дашборд</text>

  <!-- Tab 2: Желания (active) -->
  <rect x="103" y="800" width="22" height="22" rx="6" fill="#6C5CE7"/>
  <text x="114" y="836" font-size="10" text-anchor="middle" class="primary" font-weight="600">Желания</text>

  <!-- Tab 3: Календарь -->
  <rect x="184" y="800" width="22" height="22" rx="6" fill="#E5E7EB"/>
  <text x="195" y="836" font-size="10" text-anchor="middle" class="muted">Календарь</text>

  <!-- Tab 4: Дела -->
  <rect x="265" y="800" width="22" height="22" rx="6" fill="#E5E7EB"/>
  <text x="276" y="836" font-size="10" text-anchor="middle" class="muted">Дела</text>

  <!-- Tab 5: Профиль -->
  <rect x="341" y="800" width="22" height="22" rx="6" fill="#E5E7EB"/>
  <text x="352" y="836" font-size="10" text-anchor="middle" class="muted">Профиль</text>
</svg>
