# Fly.io config for Vaya (API + web + uploads in one machine).
# Replace `app` with the name you created via `fly apps create <name>`.
app = "vaya"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  WEB_DIST = "/app/public"
  UPLOAD_DIR = "/data/uploads"
  # Same-origin deploy: cookie/CORS work out of the box.
  # After first deploy set these to https://<your-app>.fly.dev
  CORS_ORIGIN = "https://vaya.fly.dev"
  PUBLIC_URL = "https://vaya.fly.dev"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http.service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/api/v1/health"
    protocol = "http"

[mounts]
  source = "vaya_data"
  destination = "/data"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
